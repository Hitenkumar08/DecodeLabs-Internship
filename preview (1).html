<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rule-Based AI Chatbot</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Segoe UI,sans-serif;background:#eef2f7;color:#172033}
.app{width:min(900px,94%);margin:35px auto;background:#fff;border-radius:18px;box-shadow:0 10px 35px rgba(0,0,0,.12);overflow:hidden}
.header{background:linear-gradient(135deg,#1d3557,#457b9d);color:#fff;padding:25px}
.header h1{margin:0 0 7px;font-size:27px}.header p{margin:0;opacity:.9}
.chat{height:500px;overflow-y:auto;padding:24px;background:#f8fafc}
.msg{display:flex;margin:13px 0}.msg.user{justify-content:flex-end}
.bubble{max-width:75%;padding:12px 16px;border-radius:15px;line-height:1.45;white-space:pre-wrap}
.bot .bubble{background:#e8eef6;border-bottom-left-radius:4px}
.user .bubble{background:#315f91;color:white;border-bottom-right-radius:4px}
.input-area{display:flex;gap:10px;padding:16px;border-top:1px solid #e5e7eb}
input{flex:1;padding:14px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px;outline:none}
button{border:0;border-radius:10px;padding:0 20px;background:#315f91;color:white;font-weight:bold;cursor:pointer}
button:hover{background:#254c74}
.quick{padding:0 16px 16px;display:flex;gap:8px;flex-wrap:wrap}
.quick button{padding:9px 12px;background:#edf2f7;color:#315f91;border:1px solid #d7e0ea}
.status{text-align:center;font-size:12px;color:#7b8494;padding-bottom:14px}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>🤖 Rule-Based AI Chatbot</h1>
    <p>Ask basic questions about AI or say hello.</p>
  </div>

  <div id="chat" class="chat"></div>

  <div class="quick">
    <button onclick="quick('hello')">Hello</button>
    <button onclick="quick('what is ai')">What is AI?</button>
    <button onclick="quick('who created you')">Who created you?</button>
    <button onclick="quick('help')">Help</button>
  </div>

  <div class="input-area">
    <input id="input" type="text" placeholder="Type your message..." autocomplete="off">
    <button onclick="send()">Send</button>
  </div>
  <div class="status">Rule-based responses • Type "exit", "quit", or "bye" to end the session</div>
</div>

<script>
const knowledgeBase = {
  "hello":"Hello! How can I assist you today?",
  "hi":"Hi there! What can I do for you?",
  "how are you":"I am operating at peak efficiency! How about you?",
  "what is ai":"AI stands for Artificial Intelligence—systems designed to mimic human reasoning.",
  "who created you":"I was built as a deterministic, rule-based AI engine.",
  "help":"You can ask me basic questions about AI, say hello, or type 'exit' to quit."
};

const fallback = "I do not understand. Try asking something else or type 'help'.";

function addMessage(text, type){
  const row=document.createElement("div");
  row.className="msg "+type;
  const bubble=document.createElement("div");
  bubble.className="bubble";
  bubble.textContent=text;
  row.appendChild(bubble);
  document.getElementById("chat").appendChild(row);
  const chat=document.getElementById("chat");
  chat.scrollTop=chat.scrollHeight;
}

function respond(text){
  const clean=text.toLowerCase().trim();
  if(!clean) return;
  addMessage(text,"user");
  if(["exit","quit","bye"].includes(clean)){
    addMessage("Terminating process... Goodbye!","bot");
    document.getElementById("input").disabled=true;
    return;
  }
  addMessage(knowledgeBase[clean] || fallback,"bot");
}

function send(){
  const el=document.getElementById("input");
  const text=el.value;
  el.value="";
  respond(text);
  el.focus();
}
function quick(text){ respond(text); document.getElementById("input").focus(); }

document.getElementById("input").addEventListener("keydown",e=>{
  if(e.key==="Enter") send();
});

addMessage("Hello! How can I assist you today?","bot");
</script>
</body>
</html>
